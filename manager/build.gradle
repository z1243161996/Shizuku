    }
}

autoResConfig {
    generatedClassFullName = "rikka.shizuku.manager.ShizukuLocales"
    generateRes = false
    generatedArrayFirstItem = "SYSTEM"
    generateLocaleConfig = true
}

materialThemeBuilder {
    themes {
        shizuku {
            primaryColor = "#3F51B5"
            lightThemeFormat = "Theme.Material3Expressive.Light.%s"
            lightThemeParent = "Theme.Material3Expressive.Light"
            darkThemeFormat = "Theme.Material3Expressive.Dark.%s"
            darkThemeParent = "Theme.Material3Expressive.Dark"
        }
        dynamic_colors_overlay {
            dynamicColors = true
            lightThemeFormat = "ThemeOverlay.Material3.DynamicColors.Light.Shizuku"
            lightThemeParent = "ThemeOverlay.Material3.DynamicColors.Light"
            darkThemeFormat = "ThemeOverlay.Material3.DynamicColors.Dark.Shizuku"
            darkThemeParent = "ThemeOverlay.Material3.DynamicColors.Dark"
        }
    }
    generatePalette = true
    generateTextColors = true
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("shizuku-v${rootProject.ext.versionName}-${variant.name}.apk")
        }
        def cap = variant.name.capitalize()
        variant.lifecycleTasks.registerPreBuild(":shell:assemble${cap}")
        def buildType = project.android.buildTypes.findByName(variant.buildType)
        if (buildType != null && buildType.minifyEnabled) {
            def outDir = new File(rootDir, "out")
            def mappingDir = new File(outDir, "mapping").absolutePath
            def apkDir = new File(outDir, "apk").absolutePath
            def apkProvider = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
            def mappingProvider = variant.artifacts.get(SingleArtifact.OBFUSCATION_MAPPING_FILE.INSTANCE)
            tasks.register("copyOut${cap}") {
                inputs.files(apkProvider)
                inputs.files(mappingProvider)
                doLast {
                    copy {
                        from mappingProvider.get().asFile
                        into mappingDir
                        rename { "mapping-${rootProject.ext.versionName}.txt" }
                    }
                    copy {
                        from apkProvider.get().asFile.listFiles().findAll { it.name.endsWith(".apk") }
                        into apkDir
                    }
                }
            }
        }
    }
}

afterEvaluate {
    def optimize = tasks.findByName("optimizeReleaseResources")
    if (optimize != null) {
        def collapse = tasks.register("collapseReleaseResourceNames") {
            doLast {
                def outputs = optimize.outputs.files.files
                if (outputs.size() != 1) {
                    throw new GradleException("expected 1 optimizeReleaseResources output, got ${outputs.size()}")
                }
                def zip = outputs.first()
                def optimized = new File("${zip.absolutePath}.opt")
                def aapt2 = project.android.sdkComponents.aapt2.executable.get().asFile
                def execOps = services.get(ExecOperations)
                execOps.exec {
                    commandLine aapt2, "optimize", "--collapse-resource-names",
                        "--resources-config-path", "aapt2-resources.cfg",
                        "-o", optimized, zip
                    ignoreExitValue = false
                }
                if (optimized.exists()) {
                    delete(zip)
                    optimized.renameTo(zip)
                }
            }
        }
        optimize.finalizedBy(collapse)
    }
    project.android.buildTypes.names.each { bt ->
        def cap = bt.capitalize()
        def copyOut = tasks.findByName("copyOut${cap}")
        if (copyOut != null) {
            tasks.named("assemble${cap}").configure { finalizedBy(copyOut) }
        }
    }
}

tasks.withType(CompileArtProfileTask.class).configureEach {
